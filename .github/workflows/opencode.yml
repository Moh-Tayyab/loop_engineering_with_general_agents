name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # On-demand beats: triggered by /oc or /opencode in a comment.
  opencode:
    if: |
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true

  # Autonomous beats: Issue-to-PR loop, PR review, and daily heartbeat.
  autonomous:
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Follow AGENTS.md. Read STATE.md first to restore loop context.

            Determine the trigger:
            - If this is a new issue: run the Autonomous Issue-to-PR Loop. If there
              is a clear, minimal fix, create a branch, implement the change, run
              any available tests, and open a pull request. If the fix is ambiguous,
              reply on the issue with analysis and concrete next steps instead.
            - If this is a pull_request event: review the PR for bugs, security
              issues, and style problems; leave an inline or summary review.
            - If this is a schedule/workflow_dispatch heartbeat: do one small,
              useful task in the repo, then report the outcome in the run log.
              Never spin — stop as soon as budget or stopping conditions in
              STATE.md §4 are met.

            Update STATE.md (beat log + current beat) before finishing.
