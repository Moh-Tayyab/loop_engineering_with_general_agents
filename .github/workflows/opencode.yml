name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  # On-demand beats: triggered by /oc or /opencode in a comment.
  opencode:
    if: |
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true

  # Autonomous beats: Issue-to-PR loop, PR review, and daily heartbeat.
  autonomous:
    if: |
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # PR reviews were being cancelled at exactly 20 min (3x on Beat 123) —
    # full maker-checker reviews need up to ~45 min (STATE §10 task 16).
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are operating a loop-trainer repo with TWO independent project loops,
            each fully self-contained: `video_generation_loop/` and `job_fetching_loop/`.
            There is no root STATE.md and no root AGENTS.md — each loop owns exactly one
            `STATE.md` + `AGENTS.md` pair, and its `AGENTS.md` carries ALL rules (budget,
            maker-checker, escalation, lessons) for that loop.

            Route by scope:
            - A task touching `video_generation_loop/` → read that loop's `STATE.md` +
              `AGENTS.md`; update only that loop's STATE.md (beat log row + current beat).
            - A task touching `job_fetching_loop/` → read that loop's `STATE.md` +
              `AGENTS.md`; update only that loop's STATE.md.
            - A task that changes shared trainer infra (workflows, `.opencode/` skills,
              subagents) → read BOTH loops' spines, decide which owns the change, and
              record the beat in the affected loop(s)' STATE.md.

            Determine the trigger:
            - If this is a new issue: run the Autonomous Issue-to-PR Loop. If there
              is a clear, minimal fix, create a branch, implement the change, run
              any available tests, and invoke the `checker` subagent (Task tool,
              read-only) to grade the change; open a pull request only on an
              APPROVED verdict. If the fix is ambiguous or the checker requests
              changes beyond the retry bound, reply on the issue with analysis
              and concrete next steps, and note it under the affected loop's STATE.md §10 for a human.
            - If this is a pull_request event: review the PR for bugs, security
              issues, and style problems; leave an inline or summary review.
            - If this is a schedule/workflow_dispatch heartbeat (weekday 9am):
              run the morning triage loop.
              1. Read each loop's AGENTS.md + STATE.md (they are self-contained).
              2. Find last night's failures and open issues:
                 `gh run list --workflow=test-gate.yml --limit=5` (look for
                 failed runs) and `gh issue list --state=open`.
              3. For each failure/issue, load the `triage-issue` skill and
                 classify it as CLEAR FIX or RISKY/AMBIGUOUS.
                 - CLEAR FIX: create a branch, implement the minimal fix, run
                   the tests for the owning loop (see that loop's AGENTS.md §3 for
                   budget + its test command), then invoke the `checker`
                   subagent (Task tool, read-only) to grade the change. Only
                   open a pull request if the checker replies APPROVED. If it
                   replies CHANGES REQUESTED, rework up to the retry bound
                   (owning loop's AGENTS.md §7), then leave it for a human.
                 - RISKY/AMBIGUOUS: do NOT touch code. Write the item under
                   the affected loop's STATE.md §10 (Open / needs a human) with
                   the evidence, and leave it for the human gate.
              4. Update the affected loop's STATE.md (beat log + current beat) before finishing.
              Never spin — stop as soon as the owning loop's budget or stopping
              conditions (its AGENTS.md §3) are met.

            Update the affected loop's STATE.md (beat log + current beat) before finishing.

  # Adversarial Checker: a dedicated "try to break it" review profile.
  # Trigger: comment /oc check or /opencode check on an issue or PR.
  adversarial-checker:
    if: |
      (github.event_name == 'issue_comment' ||
       github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc check') ||
       contains(github.event.comment.body, '/opencode check'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode (adversarial pass)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.5-free
          use_github_token: true
          prompt: |
            You are the ADVERSARIAL CHECKER for the proposed solution in this
            issue/PR. Your only job is to BREAK it. Follow the adversarial
            evaluation rules in the owning loop's AGENTS.md §6.

            1. Invalid inputs: empty/null data, boundary values, malformed input,
               extreme edge cases. Does the code crash or behave badly?
            2. Security: secret leakage, prompt/code injection, unsafe
               deserialization, overly broad permissions, SSRF/path traversal.
            3. Error paths: are exceptions handled and logged without leaking
               internal details? Does it fail open when it should fail closed?
            4. Correctness: does it actually solve the stated problem, including
               the unstated cases?

            Verdict format — reply with one of:
            - `APPROVED` if the change survives every attack you attempted.
            - `CHANGES REQUESTED` if you found any issue, listing each failing
              case with a concrete reproduction. Do NOT write code fixes; the
              Maker will address them in a rework beat.
