name: test-gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies (ffmpeg/ffprobe for merger path tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py') != ''

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f video_generation_loop/requirements.txt ]; then pip install -r video_generation_loop/requirements.txt; fi
          if [ -f job_fetching_loop/requirements.txt ]; then pip install -r job_fetching_loop/requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-cov
        if: hashFiles('pyproject.toml', 'requirements.txt', 'setup.py', 'video_generation_loop/requirements.txt', 'job_fetching_loop/requirements.txt') != ''

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        if: hashFiles('package.json') != ''

      - name: Install Node dependencies
        run: npm install
        if: hashFiles('package.json') != ''

      - name: Run tests (trainer + video loop)
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            python -m pytest -q --ignore=job_fetching_loop
          elif [ -f package.json ]; then
            npm test
          else
            echo "No test suite found in this repo yet."
          fi

      - name: Run tests (job fetching loop, isolated)
        working-directory: job_fetching_loop
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            python -m pytest -q
          else
            echo "No job loop test suite found."
          fi
